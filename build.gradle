plugins {
    id 'fabric-loom' version '1.10.5'
}
version = project.mod_version
group = 'team.minefed.mods'
base { archivesName = 'minefed-regions' }
repositories {
    mavenCentral()
    maven { url = 'https://repo.bluecolored.de/releases' }
}
loom {
    splitEnvironmentSourceSets()
    mods {
        'minefed-regions' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly 'de.bluecolored.bluemap:BlueMapAPI:2.7.2'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Apply Fabric's named-package access fixes before registry/player classes are loaded by JUnit.
    testRuntimeOnly "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
test {
    useJUnitPlatform()
    systemProperty 'fabric.side', 'server'
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
jar { from('LICENSE') }
tasks.named('sourcesJar') { from('LICENSE') }
